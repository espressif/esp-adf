version: "0.5.0~1"
description: ESP extractor service for extracting audio and video from a file or network
url: https://github.com/espressif/esp-adf/tree/master/components/esp_extractor_service
documentation: "https://github.com/espressif/esp-adf/blob/master/components/esp_extractor_service/README.md"
issues: https://github.com/espressif/esp-adf/issues

tags:
  - "extractor"
  - "demux"
  - "media_service"
  - "esp_service"
  - "gmf"
  - "adf"

dependencies:
  espressif/esp_service:
    require: public
    version: "~0.5"
    override_path: "../esp_service"
  espressif/esp_media_service:
    require: public
    version: "~0.5"
    override_path: "../esp_media_service"
  espressif/esp_extractor:
    require: public
    version: "~1.0"
  espressif/media_lib_sal:
    require: public
    version: "~1.0"
  espressif/gmf_io:
    require: private
    version: "~1.1"
  espressif/esp_hls_stream:
    require: private
    version: "~1.0"
    rules:
      - if: "$CONFIG{ESP_EXTRACTOR_SERVICE_HLS_SUPPORT} == True"
  espressif/cjson:
    require: private
    version: "*"
