version: "0.5.1"
description: ADF capture service with video and audio capture support
url: https://github.com/espressif/esp-adf/tree/master/components/esp_capture_service
documentation: "https://github.com/espressif/esp-adf/blob/master/components/esp_capture_service/README.md"
issues: "https://github.com/espressif/esp-adf/issues"

tags:
  - "capture"
  - "muxer"
  - "gmf"
  - "esp_service"
  - "adf"

dependencies:
  espressif/esp_service:
    require: public
    version: "^0.5"
    override_path: "../esp_service"
  espressif/esp_media_service:
    require: public
    version: "^0.5"
    override_path: "../esp_media_service"
  espressif/esp_capture:
    require: public
    version: "^1.0"
  espressif/esp_muxer:
    require: public
    version: "~1.2"
