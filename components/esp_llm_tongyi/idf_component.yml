version: "0.5.0"
description: Tongyi adapter for esp_llm_service
url: https://github.com/espressif/esp-adf/tree/master/components/esp_llm_tongyi
issues: https://github.com/espressif/esp-adf/issues
license: "LicenseRef-Espressif-Modified-MIT"

targets:
  - esp32
  - esp32s3
  - esp32s31
  - esp32p4
  - esp32c3
  - esp32c5
  - esp32c6

dependencies:
  espressif/esp_llm_service:
    require: public
    version: "^0.5"
    override_path: "../esp_llm_service"
  espressif/esp_websocket_client: ">=1.7.0"
  espressif/gmf_core:
    require: private
    version: "^1.0"
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"

examples:
  - path: ../../adf_examples/ai_agent/esp_llm_tongyi_agent_app
