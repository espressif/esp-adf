variables:
  ESP_DOCS_ENV_IMAGE: "$CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.5:2-1"
  ESP_DOCS_LATEST_BRANCH_NAME: "master"

.patterns-docs: &patterns-docs
  - ".gitlab/ci/docs.yml"
  - "docs/**/*"
  - "**/*.rst"

##############
# if anchors #
##############
.if-protected-docs: &if-protected-docs
  if: '($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_BRANCH =~ /^release\/v/ || $CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?($|-)/)'

.if-merge_request_event: &if-merge_request_event
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.if-label-build_docs: &if-label-build_docs
  if: '$BOT_LABEL_BUILD_DOCS || $CI_MERGE_REQUEST_LABELS =~ /^(?:[^,\n\r]+,)*build_docs(?:,[^,\n\r]+)*$/i'

.if-schedule: &if-schedule
  if: '$CI_PIPELINE_SOURCE == "schedule"'

.rules:build:docs:
  rules:
    - <<: *if-schedule
      when: never
    - <<: *if-protected-docs
    - <<: *if-merge_request_event
    - <<: *if-label-build_docs

.rules:deploy:docs_preview:
  rules:
    - <<: *if-schedule
      when: never
    - <<: *if-label-build_docs
    - <<: *if-merge_request_event
      changes: *patterns-docs

.rules:deploy:docs_production:
  rules:
    - <<: *if-schedule
      when: never
    - <<: *if-protected-docs

# stage: pre_check
check_docs_lang_sync:
  stage: pre_check
  image: $ESP_DOCS_ENV_IMAGE
  tags:
    - build_docs
  extends:
    - .rules:build:docs
  dependencies: []
  needs: []
  script:
    - cd docs
    - ./check_lang_folder_sync.sh

.build_docs_template:
  stage: build_docs
  image: $ESP_DOCS_ENV_IMAGE
  tags:
    - build_docs
  interruptible: true
  dependencies: []
  needs:
    - job: check_docs_lang_sync
      artifacts: false
      optional: true
  variables:
    DOCS_DIR: $CI_PROJECT_DIR/docs
  script:
    - cd $DOCS_DIR
    - pip install -r requirements.txt
    - build-docs --skip-reqs-check -bs $DOC_BUILDERS -l $DOCLANG build
    - echo "ESP-ADF Guide preview available at $CI_JOB_URL/artifacts/file/docs/_build/$DOCLANG/generic/html/index.html"
  parallel:
    matrix:
      - DOCLANG: ["en", "zh_CN"]

build_docs_html:
  extends:
    - .build_docs_template
    - .rules:build:docs
  artifacts:
    when: always
    paths:
      - docs/_build/*/*/*.txt
      - docs/_build/*/*/html/*
    expire_in: 4 days
  variables:
    DOC_BUILDERS: "html"

.deploy_docs_template:
  image: $ESP_DOCS_ENV_IMAGE
  tags:
    - deploy
    - shiny
  variables:
    DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
    PYTHONUNBUFFERED: 1
    # ensure all tags are fetched, deploy-docs uses `git describe` to derive
    # the version slug (latest / vX.Y / release-vX.Y / stable)
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    # tools/ci/utils.sh is already sourced by the top-level `before_script`,
    # so its helpers (e.g. add_doc_server_ssh_keys) are available directly.
    - git fetch --tags --prune
    - add_doc_server_ssh_keys $DOCS_DEPLOY_PRIVATEKEY $DOCS_DEPLOY_SERVER $DOCS_DEPLOY_SERVER_USER
    - export GIT_VER=$(git describe --always)
    - pip install -r ${CI_PROJECT_DIR}/docs/requirements.txt
    - mkdir -p logs
    - bash -o pipefail -c 'deploy-docs | tee logs/doc-url.txt'

# stage: test_deploy
deploy_docs_preview:
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_preview
  stage: test_deploy
  needs:
    - job: build_docs_html
      artifacts: true
  variables:
    TYPE: "preview"
    # older branches use DOCS_PREVIEW_PRIVATEKEY, DOCS_PREVIEW_SERVER,
    # DOCS_PREVIEW_SERVER_USER, DOCS_PREVIEW_PATH for preview server
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PREVIEW_PRIVATEKEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PREVIEW_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PREVIEW_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PREVIEW_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PREVIEW_URL_BASE"
  artifacts:
    when: always
    paths:
      - logs/doc-url.txt
    expire_in: 4 days

post_doc_preview_links:
  stage: deploy
  image: $ESP_DOCS_ENV_IMAGE
  tags:
    - deploy
    - shiny
  extends:
    - .rules:deploy:docs_preview
  needs:
    - job: deploy_docs_preview
      artifacts: true
  script:
    - python3 -m pip install python-gitlab
    - python3 ${CI_PROJECT_DIR}/tools/ci/post-mr-note.py $GITLAB_MR_NOTE_TOKEN $CI_PROJECT_PATH $CI_MERGE_REQUEST_IID --url "$GITLAB_URL_BASE"

# stage: post_deploy
deploy_docs_production:
  # The DOCS_PROD_* variables used by this job are "Protected" so these
  # branches must all be marked "Protected" in the GitLab project settings.
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_production
  stage: post_deploy
  dependencies:  # set dependencies to null to avoid missing artifacts issue
  needs:  # ensure deploy runs after push_to_github succeeded
    - job: build_docs_html
      artifacts: true
    - job: push_to_github
      artifacts: false
      optional: true
  variables:
    TYPE: "production"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PROD_DEPLOY_KEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PROD_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PROD_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PROD_PATH"
    DOCS_DEPLOY_URL_BASE: "https://docs.espressif.com/projects/esp-adf"
    DEPLOY_STABLE: 1
